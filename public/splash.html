<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading Prepadi...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .splash {
      text-align: center;
      color: #14213d;
    }
    .logo {
      width: 120px;
      height: 120px;
      background: transparent;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-sizing: border-box;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .spinner {
      border: 3px solid rgba(75,113,254,0.2);
      border-top: 3px solid #4B71FE;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo"><img src="/prepadi_logo.png" alt="Prepadi"></div>
    <h1 style="margin: 0 0 16px; font-size: 24px;">Prepadi</h1>
    <div class="spinner"></div>
  </div>
</body>
</html>
